# Serveur — écoute sur tout le réseau
server.address=0.0.0.0
server.port=8080

# Base de données PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/sotral_db
spring.datasource.username=postgres
spring.datasource.password=cicero
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Use update so missing tables are created locally instead of failing startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=sotral_jwt_secret_key_a_changer_en_prod_256bits
app.jwt.expiration=86400000

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true

# Nom application
spring.application.name=sotral-backend
