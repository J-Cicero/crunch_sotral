# Development Profile Configuration
# Server Configuration
server.servlet.context-path=/api
server.port=9081

# Database Configuration - Local Development
spring.datasource.url=jdbc:postgresql://localhost:5432/sotral_db
spring.datasource.username=postgres
spring.datasource.password=cicero
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

spring.thymeleaf.check-template-location=false

# Mail Configuration - Development (local mailhog or similar)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=dev@sotral.tech
spring.mail.password=dev_password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# JWT Configuration - Development
jwt.jwtSecret=Eqhsc05ahw+/rWm9qp3DC71L2cB6wfH3DaAS41gVwYb/Jg0Maje6tfw63Iu4rE82rNQJAbjdxhkHrQWS122dUw==
