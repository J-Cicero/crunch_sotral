# Development Profile Configuration
spring.profiles.active=dev

# Server Configuration
server.servlet.context-path=/api
server.port=9081

# Database Configuration - Local Development
spring.datasource.url=jdbc:postgresql://localhost:5432/sotral_dev
spring.datasource.username=sotral_user
spring.datasource.password=sotral_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Mail Configuration - Development (local mailhog or similar)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=dev@sotral.tech
spring.mail.password=dev_password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# JWT Configuration - Development
jwt.jwtSecret=devSecretKeyForLocalDevelopmentNotForProduction
jwt.jwtExpirationMs=86400000

# Logging Configuration - Development (verbose)
logging.level.root=INFO
logging.level.com.smart.sotral=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Swagger UI in Development
springdoc.swagger-ui.enabled=true
