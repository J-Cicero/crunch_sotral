spring.application.name=sotral
spring.profiles.active=dev
# Server Configuration
server.address=0.0.0.0
server.servlet.context-path=/api
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/sotral_db
spring.datasource.username=postgres
spring.datasource.password=cicero
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Swagger UI (springdoc): http://<YOUR_IP>:8080/api/swagger-ui/index.html (profile dev)
# OpenAPI JSON: http://<YOUR_IP>:8080/api/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs

# CORS defaults (comma separated); add your local IPv4 addresses for Angular/Flutter clients
app.cors.allowed-origins=http://localhost:4200

# Mail Configuration
spring.mail.host=mail.sotral.tech
spring.mail.port=1025
spring.mail.username=contact@sotral.tech
spring.mail.password=SotralMail2024!
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# JWT Configuration
jwt.jwtSecret=Eqhsc05ahw+/rWm9qp3DC71L2cB6wfH3DaAS41gVwYb/Jg0Maje6tfw63Iu4rE82rNQJAbjdxhkHrQWS122dUw==
