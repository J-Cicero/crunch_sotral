# Local (sandbox/offline) profile — runs with in‑memory H2 so Swagger démarre sans PostgreSQL

server.address=0.0.0.0
server.servlet.context-path=/api
server.port=8081

# H2 in‑memory database
spring.datasource.url=jdbc:h2:mem:sotral;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Mail désactivé en local
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=dev@sotral.tech
spring.mail.password=dev_password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# JWT (clé déjà longue, même qu'en dev)
jwt.jwtSecret=Eqhsc05ahw+/rWm9qp3DC71L2cB6wfH3DaAS41gVwYb/Jg0Maje6tfw63Iu4rE82rNQJAbjdxhkHrQWS122dUw==
jwt.jwtExpirationMs=86400000

# Swagger / springdoc
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs

# CORS override for your local IPs (comma separated)
app.cors.allowed-origins=http://localhost:4200

# Logging minimal
logging.level.root=INFO
logging.level.com.smart.sotral=INFO
